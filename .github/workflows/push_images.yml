name: Image Discovery, Build & Push to DockerHub
on: 
    push:
    schedule:
        - cron: '25 14 * * MON'   # Every Monday at 2:25 PM UTC

permissions:
    packages: write
    contents: read

jobs:
    discover:
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{steps.discover.outputs.matrix}}
        
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v6

            - name: Discover Images
              id: discover
              env:
                  BASE_IMAGES_REPO: ${{vars.BASE_IMAGES_REPO}}
                  SERVICE_IMAGES_REPO: ${{vars.SERVICE_IMAGES_REPO}}
              run: echo "matrix=$(python3 .github/scripts/discover_images.py)" >> "$GITHUB_OUTPUT"

    build:
        needs: discover
        name: Build & Push All Images
        uses: ./.github/workflows/build_image.yml
        strategy:
            fail-fast: false
            matrix:
                include: ${{fromJSON(needs.discover.outputs.matrix)}}
        with:
            image: ${{matrix.image}}
            image_tag: ${{matrix.tag}}
            dockerfile_path: ${{matrix.dockerfile}}
            platforms: ${{matrix.platforms}}
        secrets:
            DOCKER_USERNAME: ${{secrets.DOCKER_USERNAME}}
            DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
