name: Build & Push All Images
on: 
    push:
    schedule:
        - cron: '25 14 * * MON'   # Every Monday at 2:25 PM UTC

permissions:
    packages: write
    contents: read

jobs:
    discover:
        name: Generate Build Matrix
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{steps.discover.outputs.matrix}}
        
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v6

            - name: Discover Images
              id: discover
              run: |
                echo "matrix=$(python3 .github/scripts/image_discovery.py \
                    --base-img-repo '${{ vars.BASE_IMAGES_REPO }}' \
                    --svc-img-repo '${{ vars.SERVICE_IMAGES_REPO }}')" >> "$GITHUB_OUTPUT"

    build:
        needs: discover
        name: ${{matrix.tag}}
        uses: ./.github/workflows/build_image.yml
        strategy:
            fail-fast: false
            matrix:
                include: ${{fromJSON(needs.discover.outputs.matrix)}}
        with:
            image: ${{matrix.image}}
            image_tag: ${{matrix.tag}}
            dockerfile_path: ${{matrix.dockerfile}}
            platforms: ${{matrix.platforms}}
        secrets:
            DOCKER_USERNAME: ${{secrets.DOCKER_USERNAME}}
            DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
