name: Build & Push Images
on: 
    push:
    schedule:
        - cron: '25 14 * * MON'   # Every Monday at 2:25 PM UTC

permissions:
    packages: write
    contents: read

jobs:
    discover:
        name: Generate Build Matrix
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{steps.discover.outputs.matrix}}
        
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v6

            - name: Discover Images
              id: discover
              run: |
                echo "matrix=$(python3 .github/scripts/image_discovery.py \
                    --base-img-repo '${{vars.BASE_IMAGES_REPO}}' \
                    --svc-img-repo '${{vars.SERVICE_IMAGES_REPO}}')" >> "$GITHUB_OUTPUT"

    build:
        needs: discover
        name: ${{matrix.tag}}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include: ${{fromJSON(needs.discover.outputs.matrix)}}

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v6

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4
              with:
                  platforms: arm64
                  reset: true

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to Docker Hub
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v4
              with:
                  username: ${{secrets.DOCKER_USERNAME}}
                  password: ${{secrets.DOCKER_PASSWORD}}

            - name: Extract Metadata for Docker
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{matrix.image}}
                  tags: type=raw,value=${{matrix.tag}}

            - name: Build and Push Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ${{matrix.dockerfile}}
                  platforms: ${{matrix.platforms}}
                  pull: true
                  push: ${{github.event_name != 'pull_request'}}
                  tags: ${{steps.meta.outputs.tags}}
                  labels: ${{steps.meta.outputs.labels}}
                  cache-from: type=gha,scope=${{matrix.tag}}
                  cache-to: type=gha,scope=${{matrix.tag}},mode=max
