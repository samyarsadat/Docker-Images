name: Analyze All Images
on: 
    push:
    schedule:
        - cron: '25 17 * * MON'   # Every Monday at 5:25 PM UTC

permissions:
    security-events: write
    contents: read

jobs:
    discover:
        name: Generate Analysis Matrix
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{steps.discover.outputs.matrix}}
        
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v6

            - name: Discover Images
              id: discover
              run: |
                echo "matrix=$(python3 .github/scripts/image_discovery.py \
                    --analysis \
                    --base-img-repo '${{ vars.BASE_IMAGES_REPO }}' \
                    --svc-img-repo '${{ vars.SERVICE_IMAGES_REPO }}')" >> "$GITHUB_OUTPUT"

    build:
        needs: discover
        name: ${{matrix.tag}}
        uses: ./.github/workflows/analyze_image.yml
        strategy:
            fail-fast: false
            matrix:
                include: ${{fromJSON(needs.discover.outputs.matrix)}}
        with:
            image: ${{matrix.image}}
            image_tag: ${{matrix.tag}}
            analysis_name: ${{matrix.tag}}
